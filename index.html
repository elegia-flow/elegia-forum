<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>elegia</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header>
            <a href="#" class="logo" id="logoLink">
                <span class="logo-mark" aria-hidden="true">
                    <svg
                        viewBox="0 0 24 24"
                        width="18"
                        height="18"
                        fill="currentColor"
                    >
                        <path
                            d="M4 7h16v2H4V7zm0 4h16v2H4v-2zm0 4h16v2H4v-2z"
                        />
                    </svg>
                </span>
                <span class="logo-text">elegia</span>
            </a>

            <div class="search">
                <input type="text" id="searchInput" placeholder="Search..." />
                <button
                    type="button"
                    class="search-plus"
                    id="createPostBtn"
                    title="Create post"
                    style="display: none"
                >
                    <svg
                        viewBox="0 0 24 24"
                        width="20"
                        height="20"
                        fill="currentColor"
                    >
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                    </svg>
                </button>
            </div>

            <div class="header-right">
                <div class="auth-buttons" id="authButtons">
                    <button class="btn btn-login" type="button" id="loginBtn">
                        Log in
                    </button>
                    <button
                        class="btn btn-signup"
                        type="button"
                        id="registerBtn"
                    >
                        Sign up
                    </button>
                </div>

                <div class="user-menu" id="userInfo" style="display: none">
                    <button class="user-name-btn" id="currentUserBtn">
                        <div class="header-avatar" id="headerAvatar">?</div>
                        <span id="currentUser"></span>
                        <svg
                            width="12"
                            height="12"
                            viewBox="0 0 24 24"
                            fill="currentColor"
                        >
                            <path d="M7 10l5 5 5-5z" />
                        </svg>
                    </button>
                    <div class="user-dropdown" id="userDropdown">
                        <button type="button" id="profileBtn">Profile</button>
                        <button type="button" id="logoutBtn">Log out</button>
                    </div>
                </div>
            </div>
        </header>

        <main id="postsContainer">
            <div class="loading" id="loadingPosts">Loading posts...</div>
        </main>

        <nav class="mobile-nav" id="mobileNav" aria-label="Navigation">
            <button type="button" class="mobile-nav-btn" id="mobileFeedBtn">
                <span class="mobile-nav-icon">
                    <svg
                        viewBox="0 0 24 24"
                        width="22"
                        height="22"
                        fill="currentColor"
                    >
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
                    </svg>
                </span>
                <span>Feed</span>
            </button>
            <button type="button" class="mobile-nav-btn" id="mobileProfileBtn">
                <span class="mobile-nav-icon">
                    <div class="mobile-nav-avatar" id="mobileNavAvatar">?</div>
                </span>
                <span>You</span>
            </button>
        </nav>

        <div class="modal-overlay" id="authModal">
            <div class="modal">
                <button class="modal-close" id="closeModal" type="button">
                    &times;
                </button>
                <h2 class="modal-title" id="modalTitle">Log in</h2>
                <form id="authForm" novalidate>
                    <div
                        class="form-group"
                        id="usernameGroup"
                        style="display: none"
                    >
                        <label for="username">Username</label>
                        <input
                            type="text"
                            id="username"
                            placeholder="Choose a username"
                            autocomplete="username"
                        />
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="text"
                            id="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                        />
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            minlength="6"
                            autocomplete="current-password"
                        />
                    </div>
                    <button
                        type="submit"
                        class="btn btn-primary modal-submit"
                        id="modalSubmitBtn"
                    >
                        Log in
                    </button>
                </form>
                <div class="modal-switch">
                    <span id="switchText">Don't have an account?</span>
                    <a href="#" id="switchLink">Sign up</a>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="postModal">
            <div class="modal modal-post">
                <div class="modal-post-top">
                    <button
                        class="modal-close"
                        id="closePostModal"
                        type="button"
                        title="Close"
                    >
                        &times;
                    </button>
                    <h2 class="modal-title" id="postModalTitle">Create post</h2>
                    <button
                        type="submit"
                        form="postForm"
                        class="btn btn-primary btn-sm"
                        id="postSubmitBtn"
                    >
                        Post
                    </button>
                </div>
                <form id="postForm" novalidate>
                    <div class="form-group">
                        <label for="postTitle">Title</label>
                        <input
                            type="text"
                            id="postTitle"
                            placeholder="Title"
                            maxlength="300"
                        />
                    </div>
                    <div class="form-group">
                        <label for="postBody">Text</label>
                        <textarea
                            id="postBody"
                            rows="3"
                            placeholder="Share something..."
                        ></textarea>
                    </div>
                    <div class="form-group">
                        <div class="upload-box" id="postUploadBox">
                            <input
                                type="file"
                                id="postImageFile"
                                accept="image/jpeg,image/png,image/webp,image/gif"
                                hidden
                            />
                            <div
                                class="upload-preview"
                                id="postPreview"
                                style="display: none"
                            >
                                <img id="postPreviewImg" alt="Preview" />
                                <button
                                    type="button"
                                    class="upload-remove"
                                    id="postRemoveBtn"
                                >
                                    &times;
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="post-composer-bar">
                        <button
                            type="button"
                            class="composer-icon-btn composer-icon-btn--muted"
                            disabled
                            aria-hidden="true"
                            tabindex="-1"
                        >
                            <svg
                                viewBox="0 0 24 24"
                                width="18"
                                height="18"
                                fill="currentColor"
                            >
                                <path
                                    d="M4 7h16v2H4V7zm0 4h16v2H4v-2zm0 4h10v2H4v-2z"
                                />
                            </svg>
                        </button>
                        <span class="post-composer-spacer"></span>
                        <button
                            type="button"
                            class="composer-icon-btn"
                            id="postPickBtn"
                            title="Add photo"
                        >
                            <svg
                                viewBox="0 0 24 24"
                                width="18"
                                height="18"
                                fill="currentColor"
                            >
                                <path
                                    d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"
                                />
                            </svg>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="modal-overlay" id="profileModal">
            <div class="modal modal-profile">
                <div class="profile-topbar">
                    <button
                        type="button"
                        class="profile-icon-btn"
                        id="profileLogoutBtn"
                        title="Log out"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            width="20"
                            height="20"
                            fill="currentColor"
                        >
                            <path
                                d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"
                            />
                        </svg>
                    </button>
                    <span class="profile-topbar-title" id="profileTopTitle"
                        >Profile</span
                    >
                    <div class="profile-topbar-right">
                        <button
                            type="button"
                            class="profile-icon-btn"
                            id="profileMenuBtn"
                            title="Options"
                        >
                            <svg
                                viewBox="0 0 24 24"
                                width="20"
                                height="20"
                                fill="currentColor"
                            >
                                <path
                                    d="M4 7h16v2H4V7zm0 4h16v2H4v-2zm0 4h10v2H4v-2z"
                                />
                            </svg>
                        </button>
                        <button
                            type="button"
                            class="profile-icon-btn modal-close-inline"
                            id="closeProfileModal"
                            title="Close"
                        >
                            &times;
                        </button>
                    </div>
                </div>

                <div
                    class="profile-edit-panel"
                    id="profileEditPanel"
                    style="display: none"
                >
                    <div class="profile-edit-panel-inner">
                        <div class="profile-edit-panel-head">
                            <button
                                type="button"
                                class="profile-icon-btn"
                                id="closeEditPanel"
                            >
                                &times;
                            </button>
                            <span>Edit username</span>
                        </div>
                        <div class="profile-username-row" id="usernameEditRow">
                            <input
                                type="text"
                                id="profileUsername"
                                class="profile-username-input"
                                placeholder="New username..."
                            />
                            <button
                                type="button"
                                class="btn btn-sm btn-primary"
                                id="saveUsernameBtn"
                            >
                                Save
                            </button>
                        </div>
                    </div>
                </div>

                <div class="profile-card">
                    <div class="profile-avatar-wrap">
                        <div class="profile-avatar" id="profileAvatar">?</div>
                        <input
                            type="file"
                            id="avatarInput"
                            accept="image/jpeg,image/png,image/webp,image/gif"
                            hidden
                        />
                    </div>
                    <div
                        class="profile-username-static"
                        id="profileUsernameStatic"
                    ></div>
                    <div class="avatar-actions" id="avatarActions">
                        <button
                            type="button"
                            class="btn btn-sm btn-login"
                            id="changeAvatarBtn"
                        >
                            Change photo
                        </button>
                        <button type="button" id="deleteAvatarBtn">
                            Remove
                        </button>
                    </div>
                    <div class="profile-email" id="profileEmail"></div>
                    <div class="profile-meta">
                        Joined <span id="profileCreated"></span>
                    </div>
                    <div class="profile-stats">
                        <div class="stat">
                            <span class="stat-value" id="profilePostLikes"
                                >0</span
                            >
                            <span class="stat-label">post likes</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value" id="profileCommentLikes"
                                >0</span
                            >
                            <span class="stat-label">comment likes</span>
                        </div>
                    </div>
                </div>

                <div id="profileOwnContent">
                    <div class="profile-tabs">
                        <button
                            type="button"
                            class="profile-tab active"
                            data-tab="liked"
                        >
                            Upvoted
                        </button>
                        <button
                            type="button"
                            class="profile-tab"
                            data-tab="received"
                        >
                            Upvotes received
                        </button>
                    </div>
                    <div class="profile-tab-content" id="tabLiked">
                        <div class="profile-list" id="likedPostsList">
                            <p class="profile-empty">Loading...</p>
                        </div>
                    </div>
                    <div
                        class="profile-tab-content"
                        id="tabReceived"
                        style="display: none"
                    >
                        <div class="profile-list" id="receivedLikesList">
                            <p class="profile-empty">Loading...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="confirmModal">
            <div class="modal" style="max-width: 360px">
                <h2 class="modal-title" id="confirmTitle">Confirm</h2>
                <p id="confirmText" class="confirm-text"></p>
                <div class="confirm-actions">
                    <button
                        class="btn btn-login"
                        type="button"
                        id="confirmCancel"
                    >
                        Cancel
                    </button>
                    <button
                        class="btn btn-primary"
                        type="button"
                        id="confirmOk"
                    >
                        Delete
                    </button>
                </div>
            </div>
        </div>

        <div class="lightbox" id="lightbox" aria-hidden="true">
            <button type="button" class="lightbox-close" id="lightboxClose">
                &times;
            </button>
            <img id="lightboxImg" alt="" />
        </div>

        <div id="toastContainer"></div>
        <script src="script.js"></script>
    </body>
</html>
